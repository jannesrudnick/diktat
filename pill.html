<!doctype html>
<meta charset="utf-8">
<style>
  /* Look borrowed from qey's recording dock. */
  :root { --recording: oklch(0.68 0.22 25); --level: 0; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 0 16px 16px; box-sizing: border-box;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; color: #f4f4f5;
  }
  .surface {
    background: rgb(9 9 11 / .92); border: 1px solid rgb(255 255 255 / .1); backdrop-filter: blur(24px);
    box-shadow: 0 12px 40px -8px rgb(0 0 0 / .55), 0 0 0 1px rgb(0 0 0 / .4);
  }
  #card {
    max-width: 100%; box-sizing: border-box; border-radius: 16px; padding: 8px 12px;
    animation: in .15s ease-out;
  }
  #text { margin: 0; max-height: 54px; overflow: hidden; display: flex; flex-direction: column-reverse; }
  #text i { color: #a1a1aa; }
  #text .hint { color: #71717a; }
  #text .err { color: #fca5a5; }
  #text b { font-weight: 600; color: #a1a1aa; }
  #grip { display: flex; align-items: center; height: 32px; padding: 0 2px 0 4px; color: #52525b; cursor: grab; touch-action: none; }
  #grip:hover { color: #a1a1aa; }
  #grip:active { cursor: grabbing; }
  #dock { display: flex; align-items: center; gap: 4px; border-radius: 999px; padding: 6px; animation: in .15s ease-out; }
  .rec { display: flex; align-items: center; gap: 14px; padding: 0 4px 0 6px; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--recording);
    box-shadow: 0 0 0 calc(3px + var(--level) * 7px) color-mix(in oklch, var(--recording) 25%, transparent);
    transition: box-shadow 80ms;
  }
  #timer { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  #bars { display: flex; align-items: center; gap: 2px; height: 16px; padding: 0 6px; }
  #bars span { width: 3px; border-radius: 3px; background: #34d399; height: 3px; transition: height 80ms; }
  .divider { width: 1px; height: 20px; background: rgb(255 255 255 / .1); margin: 0 2px; }
  button {
    font: inherit; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    height: 32px; border-radius: 999px; transition: background .15s, transform .1s;
  }
  button:active { transform: scale(.98); }
  #cancel { width: 32px; justify-content: center; background: transparent; color: #a1a1aa; }
  #cancel:hover { background: rgb(255 255 255 / .1); color: #fff; }
  #insert { background: #fff; color: #09090b; font-weight: 500; padding: 0 12px; margin-left: 2px; }
  #insert:hover { background: #e4e4e7; }
  kbd { font: 11px ui-monospace, monospace; opacity: .55; }
  .busy #insert, .busy #cancel { opacity: .5; pointer-events: none; }
  @keyframes in { from { opacity: 0; transform: translateY(4px) } }
</style>
<div id="card" class="surface"><p id="text"></p></div>
<div id="dock" class="surface">
  <div id="grip" title="Verschieben">
    <svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="13" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
  </div>
  <div class="rec"><span id="dot"></span><span id="timer">00:00</span></div>
  <div id="bars"><span></span><span></span><span></span><span></span><span></span></div>
  <span class="divider"></span>
  <button id="cancel" title="Verwerfen (Esc)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button id="insert" title="Einfügen (Enter)">Einfügen <kbd>⏎</kbd></button>
</div>
<script src="providers.js"></script>
<script>
const BAR_WEIGHTS = [0.35, 0.7, 1, 0.7, 0.35]

// AudioWorklet that forwards raw Float32 samples to the main thread.
const worklet = URL.createObjectURL(new Blob([`
  registerProcessor('tap', class extends AudioWorkletProcessor {
    process([input]) { if (input[0]) this.port.postMessage(input[0].slice()); return true }
  })`], { type: 'text/javascript' }))

let s = null // current session
let hint = 'Sprich einfach …'

const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

// Mic and system audio are transcribed as separate tracks (one provider connection each).
// Every newly finalized piece of a track becomes a timestamped segment, so the tracks can be
// interleaved in speaking order (by finalization time) into one transcript with speaker turns.
function onFinal(ses, tr, final) {
  if (final === tr.final) return
  if (final.startsWith(tr.final)) ses.segs.push({ at: Date.now(), tr, text: final.slice(tr.final.length) })
  else { // provider rewrote earlier text: collapse this track into one segment at its first position
    const at = ses.segs.find((g) => g.tr === tr)?.at ?? Date.now()
    ses.segs = ses.segs.filter((g) => g.tr !== tr).concat({ at, tr, text: final }).sort((a, b) => a.at - b.at)
  }
  tr.final = final
}

// Consecutive segments of the same track, joined: [{ tr, text }].
function turns(ses) {
  const out = []
  for (const g of ses.segs) {
    if (!g.text.trim()) continue
    const last = out.at(-1)
    last?.tr === g.tr ? (last.text = join(last.text, g.text)) : out.push({ tr: g.tr, text: g.text })
  }
  return out
}

// Speaker labels only once both tracks actually said something; otherwise plain text as before.
function transcript(ses) {
  const ts = turns(ses)
  if (new Set(ts.map((t) => t.tr)).size < 2) return ts[0]?.tr.final ?? ''
  return ts.map((t) => `${t.tr.label}: ${t.text.trim()}`).join('\n')
}

function render(ses) {
  const ts = turns(ses)
  const labelled = new Set([...ts.map((t) => t.tr), ...ses.tracks.filter((t) => t.partial)]).size > 1
  const lines = ts.map((t) => ({ tr: t.tr, html: esc(t.text.trim()) }))
  for (const tr of ses.tracks.filter((t) => t.partial)) {
    const last = lines.at(-1)
    last?.tr === tr ? (last.html += ` <i>${esc(tr.partial.trim())}</i>`) : lines.push({ tr, html: `<i>${esc(tr.partial.trim())}</i>` })
  }
  text.innerHTML = lines.length
    ? `<span>${lines.map((l) => (labelled ? `<b>${l.tr.label}:</b> ` : '') + l.html).join('<br>')}</span>`
    : `<span class="hint">${hint}</span>`
}

function setLevel(level) {
  document.documentElement.style.setProperty('--level', level)
  bars.querySelectorAll('span').forEach((b, i) => (b.style.height = `${Math.max(3, Math.min(16, level * BAR_WEIGHTS[i] * 22))}px`))
}

function finish(result) {
  if (!s) return
  const ses = s
  clearInterval(ses.timer)
  ses.stream?.getTracks().forEach((t) => t.stop())
  ses.system?.getTracks().forEach((t) => t.stop())
  ses.ctx?.close()
  ses.tracks.forEach((t) => t.conn.close())
  s = null
  document.body.classList.remove('busy')
  setLevel(0)
  api.done(result.trim())
}

function fail(ses, msg) {
  if (s !== ses) return
  if (ses.stopping) return finish(transcript(ses)) // keep what we have
  text.innerHTML = `<span class="err">⚠ ${esc(msg)}</span>`
  setTimeout(() => s === ses && finish(''), 3000)
}

// System audio (the other side of a call) via loopback capture. Optional: falls back to mic only.
async function systemAudio() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true })
    stream.getVideoTracks().forEach((t) => t.stop())
    if (stream.getAudioTracks().length) return stream
  } catch (e) {
    console.warn('System audio unavailable', e)
  }
  hint = 'Nur Mikrofon – Systemaudio nicht verfügbar'
}

async function start() {
  const { provider, key, systemAudio: withSystem } = await api.getConfig()
  const p = PROVIDERS[provider]
  const ses = (s = { tracks: [], segs: [] })
  hint = withSystem ? 'Sprich einfach … (Mikrofon + Systemaudio)' : 'Sprich einfach …'
  const t0 = Date.now()
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000)
    timer.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`
  }
  tick()
  ses.timer = setInterval(tick, 250)
  render(ses)

  const allDone = () => ses.tracks.every((t) => t.done) && finish(transcript(ses))
  const track = (label, onError) => {
    const tr = { label, final: '', partial: '', done: false, level: 0 }
    tr.conn = p.connect(key, {
      text: (final, partial) => { if (s === ses) { onFinal(ses, tr, final); tr.partial = partial; render(ses) } },
      done: (final) => { if (s === ses) { onFinal(ses, tr, final); tr.partial = ''; tr.done = true; allDone() } },
      error: (msg) => s === ses && onError(msg, tr),
    })
    ses.tracks.push(tr)
    return tr
  }
  const mic = track('Ich', (msg) => fail(ses, `${p.label}: ${msg}`))

  // In parallel with the mic, while the user activation main started us with is still fresh.
  const system = withSystem ? systemAudio() : null
  try {
    ses.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } })
  } catch (e) {
    system?.then((st) => st?.getTracks().forEach((t) => t.stop()))
    return fail(ses, 'Kein Mikrofonzugriff')
  }
  ses.system = await system
  if (s === ses) render(ses) // hint may have changed
  if (s !== ses || ses.stopping) return [ses.stream, ses.system].forEach((st) => st?.getTracks().forEach((t) => t.stop())) // cancelled meanwhile
  ses.ctx = new AudioContext({ sampleRate: p.rate })
  await ses.ctx.audioWorklet.addModule(worklet)
  const feed = (stream, tr) => {
    const node = new AudioWorkletNode(ses.ctx, 'tap', { channelCount: 1, channelCountMode: 'explicit' })
    node.port.onmessage = ({ data }) => {
      if (ses.stopping || tr.done) return
      // RMS → 0..1 with fast attack / slow release so the animation feels alive but not jittery.
      const rms = Math.sqrt(data.reduce((a, v) => a + v * v, 0) / data.length)
      const target = Math.min(1, rms * 12)
      tr.level = target > tr.level ? target : tr.level * 0.85 + target * 0.15
      setLevel(Math.max(...ses.tracks.map((t) => t.level)))
      tr.conn.audio(data)
    }
    ses.ctx.createMediaStreamSource(stream).connect(node)
  }
  feed(ses.stream, mic)
  // A failing system track is dropped; the mic keeps going.
  if (ses.system) feed(ses.system, track('System', (msg, tr) => { console.warn('System track:', msg); tr.conn.close(); tr.done = true; if (ses.stopping) allDone() }))
}

function stop() {
  if (!s || s.stopping) return
  const ses = s
  ses.stopping = true
  document.body.classList.add('busy')
  setLevel(0)
  ses.stream?.getTracks().forEach((t) => t.stop())
  ses.system?.getTracks().forEach((t) => t.stop())
  ses.tracks.forEach((t) => t.done || t.conn.end())
  setTimeout(() => s === ses && finish(transcript(ses)), 5000) // safety net
}

api.on('start', start)
api.on('stop', stop)
api.on('cancel', () => finish(''))
insert.onclick = stop
cancel.onclick = () => finish('')

// Drag handle: pointer capture keeps the events coming while the window follows the cursor.
let drag = null
grip.onpointerdown = (e) => { drag = { x: e.screenX, y: e.screenY }; grip.setPointerCapture(e.pointerId) }
grip.onpointermove = (e) => {
  if (!drag) return
  api.move(e.screenX - drag.x, e.screenY - drag.y)
  drag = { x: e.screenX, y: e.screenY }
}
grip.onpointerup = grip.onpointercancel = () => { if (drag) api.moved(); drag = null }

// Window is click-through except over the card/dock.
for (const el of [card, dock]) {
  el.onmouseenter = () => api.mouse(true)
  el.onmouseleave = () => drag || api.mouse(false)
}
</script>
