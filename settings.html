<!doctype html>
<meta charset="utf-8">
<title>Diktat – Einstellungen</title>
<style>
  body { font: 14px -apple-system, sans-serif; padding: 20px; color-scheme: light dark; }
  label { display: block; margin-bottom: 6px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 14px; }
</style>
<label for="provider">Provider</label>
<select id="provider"></select>
<label for="key">API-Key (<a id="link" target="_blank">hier holen</a>)</label>
<input id="key" type="password" autofocus>
<button id="save">Speichern</button>
<script src="providers.js"></script>
<script>
  let keys = {}
  const select = (id) => {
    provider.value = id
    key.value = keys[id] || ''
    link.href = PROVIDERS[id].keyUrl
  }
  api.getSettings().then((c) => {
    keys = c.keys
    provider.innerHTML = Object.entries(PROVIDERS).map(([id, p]) => `<option value="${id}">${p.label}</option>`).join('')
    select(c.provider)
  })
  provider.onchange = () => select(provider.value)
  save.onclick = () => key.value.trim() && api.saveSettings(provider.value, key.value)
  key.onkeydown = (e) => { if (e.key === 'Enter') save.click() }
</script>
